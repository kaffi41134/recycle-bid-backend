spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/recycle_bid
    driver-class-name: org.postgresql.Driver
    username: recycle_bid_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

jwt:
  secret: ${JWT_SECRET}
  issuer: recycle-bid-system
  expiration: 30m
